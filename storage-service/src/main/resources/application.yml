server:
  port: ${APP_SERVER_PORT}
  servlet:
    contextPath: /storage-service
spring:
  main:
    allow-bean-definition-overriding: true
  batch:
    job:
      enabled: false
    initialize-schema: ALWAYS
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    tomcat:
      test-while-idle: true
      validation-query: SELECT 1
    initialization-mode: never
    platform: mysql
  jpa:
    database: SQL_SERVER
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2012Dialect
        jdbc:
          batch_size: 10000
          order_inserts: true
          order_updates: true
          time_zone: UTC
    hibernate:
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
      ddl-auto: update
    generate-ddl: true
  flyway:
    locations:
      - classpath:db/migration
    table: flyway_storage_schema_history
    baseline-on-migrate: true
isis:
  audit:
    enabled: ${AUDIT_ENABLED}
  cloud:
    aws:
      opensearch:
        username: ${AWS_OPENSEARCH_USERNAME}
        password: ${AWS_OPENSEARCH_PASSWORD}
        hostname: ${AWS_OPENSEARCH_HOSTNAME}
        index-path: ${AWS_OPENSEARCH_INDEX_PATH}
  security:
    jwt-public-key: ${JWT_PUBLIC_KEY}
  internal:
    authentication:
      api-key: ${API_KEY}
      api-secret: ${API_SECRET}
      client-id: ${CLIENT_ID}
      client-secret: ${CLIENT_SECRET}
      access-token-url: ${ACCESS_TOKEN_URL}
    services:
      audit:
        endpoint: ${AUDIT_SERVICE_ENDPOINT}
      notification:
        endpoint: ${NOTIFICATION_SERVICE_ENDPOINT}
  scheduler:
    policy-processor:
      all-pending:
        cron: ${SCHEDULER_PROCESSOR_ALL_PENDING_CRON}
        lock-time: ${SCHEDULER_PROCESSOR_ALL_PENDING_LOCK_TIME}
  search:
    timeout: ${SEARCH_TIMEOUT}
  database:
    batch-size: ${DATABASE_BATCH_SIZE}
  batch-process:
    policy-processing:
      size: ${POLICY_PROCESSING_BATCH_SIZE}
      core-pool-size: ${POLICY_PROCESSING_CORE_POOL_SIZE}
      max-pool-size: ${POLICY_PROCESSING_MAX_POOL_SIZE}
      queue-capacity: ${POLICY_PROCESSING_QUEUE_CAPACITY}
      reader-page-size: ${POLICY_PROCESSING_READER_PAGE_SIZE}