server:
  port: ${APP_SERVER_PORT}
  servlet:
    contextPath: /extraction-service
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    tomcat:
      test-while-idle: true
      validation-query: SELECT 1
    initialization-mode: never
    platform: mysql
  jpa:
    database: SQL_SERVER
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2012Dialect
        jdbc:
          time_zone: UTC
    hibernate:
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
isis:
  audit:
    enabled: ${AUDIT_ENABLED}
  cloud:
    aws:
      s3:
        url: s3.eu-west-2.amazonaws.com
        region: eu-west-2
        accessKey: REMOVED_AWS_ACCESS_KEY
        secretKey: REMOVED_AWS_SECRET_KEY
        raw-bucket: ${AWS_S3_RAW_BUCKET}
        ingress-bucket: ${AWS_S3_INGRESS_BUCKET}
        processed-bucket: ${AWS_S3_PROCESSED_BUCKET}
      opensearch:
        username: ${AWS_OPENSEARCH_USERNAME}
        password: ${AWS_OPENSEARCH_PASSWORD}
        hostname: ${AWS_OPENSEARCH_HOSTNAME}
  security:
    jwt-public-key: ${JWT_PUBLIC_KEY}
  internal:
    authentication:
      client-id: ${CLIENT_ID}
      client-secret: ${CLIENT_SECRET}
      access-token-url: ${ACCESS_TOKEN_URL}
    services:
      storage:
        endpoint: ${STORAGE_SERVICE_ENDPOINT}
      audit:
        endpoint: ${AUDIT_SERVICE_ENDPOINT}
      notification:
        endpoint: ${NOTIFICATION_SERVICE_ENDPOINT}
  download:
    timeout: ${AZURE_DOWNLOAD_TIMEOUT}
    scheduler:
      max-lock-time: ${DOWNLOAD_SCHEDULER_MAX_LOCK_TIME}
      bloomberg:
        cron: ${BLOOMBERG_DOWNLOAD_SCHEDULER_CRON}
        lock-time: ${BLOOMBERG_DOWNLOAD_SCHEDULER_LOCK_TIME}
      reuters:
        cron: ${REUTERS_DOWNLOAD_SCHEDULER_CRON}
        lock-time: ${REUTERS_DOWNLOAD_SCHEDULER_LOCK_TIME}
    directory:
      bloomberg: ${BLOOMBERG_DIRECTORY_NAME}
      ice-chat: ${ICE_CHAT_DIRECTORY_NAME}
      reuters: ${REUTERS_DIRECTORY_NAME}
      symphony: ${SYMPHONY_DIRECTORY_NAME}
      whatsapp: ${WHATSAPP_DIRECTORY_NAME}
    batch-size: ${BATCH_SIZE}
  azure:
    connection-string: ${AZURE_CONNECTION_STRING}
    share-name: ${AZURE_SHARE_NAME}