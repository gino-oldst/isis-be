server:
  port: ${APP_SERVER_PORT}
  servlet:
    contextPath: /extraction-service
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    tomcat:
      test-while-idle: true
      validation-query: SELECT 1
    initialization-mode: never
    platform: mysql
  jpa:
    database: SQL_SERVER
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2008Dialect
        jdbc:
          time_zone: UTC
    hibernate:
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
isis:
  audit:
    enabled: ${AUDIT_ENABLED}
  security:
    jwt-public-key: ${JWT_PUBLIC_KEY}
  internal:
    authentication:
      client-id: ${CLIENT_ID}
      client-secret: ${CLIENT_SECRET}
      access-token-url: ${ACCESS_TOKEN_URL}
    services:
      storage:
        endpoint: ${STORAGE_SERVICE_ENDPOINT}
      audit:
        endpoint: ${AUDIT_SERVICE_ENDPOINT}
      notification:
        endpoint: ${NOTIFICATION_SERVICE_ENDPOINT}
  download:
    timeout: ${AZURE_DOWNLOAD_TIMEOUT}
    scheduler:
      cron: ${DOWNLOAD_SCHEDULER_CRON}
      lock-time: ${DOWNLOAD_SCHEDULER_LOCK_TIME}
      max-lock-time: ${DOWNLOAD_SCHEDULER_MAX_LOCK_TIME}
  azure:
    connection-string: ${AZURE_CONNECTION_STRING}
    share-name: ${AZURE_SHARE_NAME}